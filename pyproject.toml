[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atomsim"
version = "0.1.0"
description = "A physically rigorous, deeply customizable quantum atom model. Never quietly lies about physics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Yash Gupta", email = "yashgupta2009yg@gmail.com" }]
keywords = [
    "quantum-mechanics",
    "atomic-physics",
    "hartree-fock",
    "schrodinger",
    "spectroscopy",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    # No "License :: OSI Approved :: MIT License" classifier: PEP 639 replaced
    # those with the `license` expression above, and setuptools refuses the
    # build outright if both are present.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Never imported by this package, and required anyway. uvicorn ships no
    # websocket implementation of its own, and `/ws/jobs/{id}` is how every
    # job reports progress; without one uvicorn declines the upgrade, the
    # request stays plain HTTP, no route matches and the client gets a 404.
    # The pytest suite cannot catch its absence, because Starlette's TestClient
    # speaks websockets in process and never reaches uvicorn. Only
    # `scripts/smoke_container.sh` does. Undeclared until 2026-08-07, when the
    # first environment that did not supply it transitively was the deployed
    # one.
    "websockets>=13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/yaasshh09/AtomSim"
Repository = "https://github.com/yaasshh09/AtomSim"
Issues = "https://github.com/yaasshh09/AtomSim/issues"

[project.scripts]
atomsim = "atomsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atomsim = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E741"]  # physics convention: l = orbital angular momentum quantum number
