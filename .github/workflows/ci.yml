name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v --cov=atomsim --cov-report=term

  web:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build (includes tsc --noEmit)
        run: npm run build

  # ubuntu, not windows: the other two jobs run on Windows because that is
  # where this project is developed, but Linux containers do not build on a
  # Windows runner.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build
        run: docker build --build-arg VITE_SITE_URL=https://atomsim.fly.dev -t atomsim:ci .
      # A build that succeeds proves the image compiles, not that it serves an
      # application. This asks it for the interface and a finished job.
      - name: Smoke test
        run: bash scripts/smoke_container.sh atomsim:ci

  deploy:
    runs-on: ubuntu-latest
    # The gate: a red suite must not reach a public URL.
    needs: [python, web, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-atomsim
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master
      # --ha=false: a second machine would split JobStore and TokenBucket, and
      # a client would get job ids that do not exist on whichever instance it
      # reaches next. See docs/DEPLOY.md.
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # A fresh deploy leaves the machine cold, and cold measured 22.5 s
      # against 1.6 s for a resume from snapshot. Paying that here means no
      # visitor pays it, which matters most right after a deploy: that is
      # exactly when a link is likely to be shared.
      - name: Warm the new machine
        run: >
          curl -fsS --retry 5 --retry-all-errors --max-time 90
          https://atomsim.fly.dev/api/health
