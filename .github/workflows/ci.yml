name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v --cov=atomsim --cov-report=term

  web:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build (includes tsc --noEmit)
        run: npm run build

  # ubuntu, not windows: the other two jobs run on Windows because that is
  # where this project is developed, but Linux containers do not build on a
  # Windows runner.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build
        run: docker build --build-arg VITE_SITE_URL=https://atomsim.fly.dev -t atomsim:ci .
      # A build that succeeds proves the image compiles, not that it serves an
      # application. This asks it for the interface and a finished job.
      - name: Smoke test
        run: bash scripts/smoke_container.sh atomsim:ci
