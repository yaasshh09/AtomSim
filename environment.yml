name: atomsim
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=2.0
  - scipy>=1.15
  - fastapi>=0.115
  - uvicorn>=0.30
  # uvicorn ships no websocket implementation; see the note in pyproject.toml.
  # conda-forge happened to supply this transitively, which is exactly why its
  # absence went unnoticed until the app ran somewhere else.
  - websockets>=13
  - httpx>=0.27
  - nodejs=22
  - pytest>=8
  - pytest-cov
  - ruff
  - pip
  - pip:
      - -e .[dev]
